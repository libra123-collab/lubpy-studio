services:
  postgres:
    image: postgres:16-alpine
    container_name: lubpy-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lubpy_studio
    ports:
      - "5432:5432"
    volumes:
      - lubpy_pgdata:/var/lib/postgresql/data

volumes:
  lubpy_pgdata:
